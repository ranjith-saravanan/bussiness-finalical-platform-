version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mybiz-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mybiz.db
      - SECRET_KEY=mybiz-secret-key-change-in-production-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/mybiz.db:/app/mybiz.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mybiz-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
